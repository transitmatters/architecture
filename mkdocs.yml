site_name: TransitMatters Labs
site_description: How TransitMatters Labs projects fit together, for new volunteers
site_url: https://transitmatters.github.io/architecture/
repo_url: https://github.com/transitmatters/architecture
repo_name: transitmatters/architecture
edit_uri: edit/main/docs/
copyright: © TransitMatters

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: assets/flask.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Local dev reference: getting-started/local-dev.md
  - Architecture:
      - architecture/index.md
      - Data sources: architecture/data-sources.md
      - Data pipeline: architecture/data-pipeline.md
      - IDs & stations: architecture/ids.md
      - Hosting & deploys: architecture/hosting.md
      - Tech stack: architecture/stack.md
  - Projects:
      - projects/index.md
      - Apps:
          - Data Dashboard: projects/data-dashboard.md
          - New Train Tracker: projects/new-train-tracker.md
          - Shutdown Tracker: projects/shutdown-tracker.md
          - Slow Zone Bot: projects/slow-zone-bot.md
          - Regional Rail Explorer: projects/regional-rail-explorer.md
          - Futures Explorer: projects/futures-explorer.md
          - Station Explorer: projects/station-explorer.md
          - Pride Bus: projects/pride-bus.md
          - COVID Recovery Dashboard: projects/covid-recovery-dash.md
      - Data pipeline:
          - data-ingestion: projects/data-ingestion.md
          - mbta-performance: projects/mbta-performance.md
          - gobble: projects/gobble.md
          - slow-zones: projects/slow-zones.md
      - Libraries & tools: projects/libraries.md
  - FAQ: faq.md
  - Glossary: glossary.md

validation:
  links:
    anchors: warn
    unrecognized_links: warn

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/transitmatters
    - icon: fontawesome/solid/globe
      link: https://transitmatters.org/transitmatters-labs
